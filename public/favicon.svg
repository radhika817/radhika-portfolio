<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2f" />
      <stop offset="100%" stop-color="#07040d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.4" />

  <!-- Monogram RK in Space Grotesk styling with subtle glow -->
  <g filter="url(#glow)">
    <!-- R -->
    <path d="M 17 44 L 17 20 L 28 20 C 33 20 36 23 36 27 C 36 30.5 33.5 33 29.5 33.5 L 36.5 44 L 30.5 44 L 24.5 34.5 L 22.5 34.5 L 22.5 44 Z M 22.5 29.5 L 27.5 29.5 C 30 29.5 31 28.5 31 26.8 C 31 25.2 30 24.5 27.5 24.5 L 22.5 24.5 Z" fill="url(#violetGrad)" />
    
    <!-- K stem and legs -->
    <path d="M 39 44 L 39 20 L 44 20 L 44 30 L 49.5 20 L 55.5 20 L 47.5 33 L 56 44 L 50 44 L 43.5 35 L 43.5 44 Z" fill="#ffffff" />
  </g>
</svg>
